security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email     # Correspond au payload de ton front
                password_path: password  # Correspond au payload de ton front
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # 3. La protection du reste de l'API (Bien aligné avec "login" et "dev")
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    # Note: Only the *first* matching rule is applied
    access_control:
        # On autorise tout le monde à voir le catalogue et à se connecter/s'inscrire
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        # ── Routes back-office (ROLE_ADMIN) ──
        # ⚠️ À garder AVANT les règles publiques plus générales (première règle qui matche gagne)
        - { path: ^/api/products/admin, roles: ROLE_ADMIN }
        - { path: ^/api/categories/admin, roles: ROLE_ADMIN }
        - { path: ^/api/carousel/admin, roles: ROLE_ADMIN }
        - { path: ^/api/auth/users, roles: ROLE_ADMIN }
        - { path: ^/api/orders/(all|stats), roles: ROLE_ADMIN }
        - { path: ^/api/orders/\d+/status, roles: ROLE_ADMIN }
        - { path: ^/api/categories, roles: PUBLIC_ACCESS, methods: [ 'GET' ] }
        - { path: ^/api/products, roles: PUBLIC_ACCESS, methods: [ 'GET' ] }
        - { path: ^/api/carousel, roles: PUBLIC_ACCESS, methods: [ 'GET' ] }
        - { path: ^/api/carousel, roles: ROLE_ADMIN, methods: [ 'POST', 'PUT', 'DELETE' ] }

        # On bloque les routes de modification du catalogue (réservé aux admins)
        - { path: ^/api/categories, roles: ROLE_ADMIN, methods: [ 'POST', 'PUT', 'DELETE' ] }
        - { path: ^/api/products, roles: ROLE_ADMIN, methods: [ 'POST', 'PUT', 'DELETE' ] }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
